<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title description">
  <title id="title">SyncTrace repository management updates</title>
  <desc id="description">An overview of the repository management features added to SyncTrace, including the repository dashboard, backend lifecycle, source-removed mapping behavior, and validation status.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .title { font-size: 39px; font-weight: 750; fill: #fff; }
      .subtitle { font-size: 17px; fill: #dbeafe; }
      .section { font-size: 21px; font-weight: 750; }
      .card-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 15px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .white { fill: #fff; }
      .number { font-size: 15px; font-weight: 800; fill: #fff; }
      .check { font-size: 14px; font-weight: 700; fill: #047857; }
    </style>
  </defs>

  <rect width="1440" height="1000" fill="#f3f6fb"/>
  <rect width="1440" height="202" fill="url(#header)"/>
  <circle cx="1305" cy="55" r="115" fill="#60a5fa" opacity=".12"/>
  <circle cx="1375" cy="158" r="78" fill="#22d3ee" opacity=".12"/>
  <text x="74" y="58" class="eyebrow" fill="#93c5fd">SYNCTRACE · FEATURE UPDATE</text>
  <text x="74" y="112" class="title">Manage Source Code Repositories</text>
  <text x="74" y="151" class="subtitle">What changed · linked repositories, ingestion controls, team roles, and mapping-safe unlinking</text>
  <rect x="74" y="170" width="250" height="5" rx="3" fill="url(#accent)"/>

  <text x="74" y="248" class="section">What users can do now</text>
  <text x="74" y="273" class="small">Repository management is available from the Source Code page.</text>

  <g filter="url(#shadow)">
    <rect x="74" y="296" width="405" height="280" rx="16" fill="#fff"/>
    <rect x="74" y="296" width="405" height="7" rx="4" fill="url(#accent)"/>
    <circle cx="109" cy="341" r="18" fill="#2563eb"/><text x="104" y="347" class="number">1</text>
    <text x="139" y="347" class="card-title">Link &amp; organize</text>
    <text x="101" y="386" class="body">• Link a GitHub repository after URL/access validation</text>
    <text x="101" y="418" class="body">• Assign a team role:</text>
    <rect x="101" y="434" width="75" height="27" rx="13" fill="#eff6ff"/><text x="114" y="452" class="small" fill="#1d4ed8">Frontend</text>
    <rect x="184" y="434" width="79" height="27" rx="13" fill="#eff6ff"/><text x="197" y="452" class="small" fill="#1d4ed8">Backend</text>
    <rect x="271" y="434" width="70" height="27" rx="13" fill="#eff6ff"/><text x="283" y="452" class="small" fill="#1d4ed8">Mobile</text>
    <rect x="349" y="434" width="74" height="27" rx="13" fill="#eff6ff"/><text x="361" y="452" class="small" fill="#1d4ed8">Shared</text>
    <text x="101" y="493" class="body">• Change a repository’s assigned role later</text>
    <text x="101" y="525" class="body">• See repositories scoped to the current team</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="517" y="296" width="405" height="280" rx="16" fill="#fff"/>
    <rect x="517" y="296" width="405" height="7" rx="4" fill="#8b5cf6"/>
    <circle cx="552" cy="341" r="18" fill="#7c3aed"/><text x="547" y="347" class="number">2</text>
    <text x="582" y="347" class="card-title">Ingest &amp; track</text>
    <text x="544" y="386" class="body">• Ingest one linked repository or ingest all</text>
    <text x="544" y="418" class="body">• Retry a failed repository ingestion</text>
    <text x="544" y="450" class="body">• Review per-repository state:</text>
    <rect x="544" y="466" width="100" height="28" rx="14" fill="#f1f5f9"/><text x="558" y="485" class="small">Not ingested</text>
    <rect x="653" y="466" width="85" height="28" rx="14" fill="#fef3c7"/><text x="669" y="485" class="small" fill="#92400e">In progress</text>
    <rect x="747" y="466" width="78" height="28" rx="14" fill="#dcfce7"/><text x="765" y="485" class="small" fill="#166534">Ingested</text>
    <rect x="834" y="466" width="64" height="28" rx="14" fill="#fee2e2"/><text x="850" y="485" class="small" fill="#991b1b">Failed</text>
    <text x="544" y="525" class="body">• Shows file count and last error when available</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="296" width="405" height="280" rx="16" fill="#fff"/>
    <rect x="960" y="296" width="405" height="7" rx="4" fill="#f59e0b"/>
    <circle cx="995" cy="341" r="18" fill="#d97706"/><text x="990" y="347" class="number">3</text>
    <text x="1025" y="347" class="card-title">Unlink without losing mappings</text>
    <text x="987" y="386" class="body">• Inspect affected components and mapping count</text>
    <text x="987" y="418" class="body">• Confirm before unlinking the repository</text>
    <rect x="987" y="442" width="350" height="74" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="1005" y="471" class="card-title" fill="#9a3412">Source removed</text>
    <text x="1005" y="495" class="small" fill="#9a3412">Existing components and mappings are preserved.</text>
    <text x="987" y="548" class="body">• Marker is visible in component and matrix views</text>
  </g>

  <text x="74" y="627" class="section">How the update fits together</text>
  <g filter="url(#shadow)">
    <rect x="74" y="650" width="1291" height="124" rx="16" fill="#fff"/>
    <rect x="103" y="683" width="260" height="58" rx="12" fill="#eff6ff"/>
    <text x="127" y="708" class="card-title" fill="#1d4ed8">Source Code page</text>
    <text x="127" y="730" class="small">Link · role · ingest · unlink</text>
    <path d="M383 712h70m-12-10 12 10-12 10" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="474" y="683" width="325" height="58" rx="12" fill="#f5f3ff"/>
    <text x="498" y="708" class="card-title" fill="#6d28d9">Team-scoped API &amp; service</text>
    <text x="498" y="730" class="small">Validate · authorize · track status</text>
    <path d="M819 712h70m-12-10 12 10-12 10" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="910" y="683" width="415" height="58" rx="12" fill="#ecfdf5"/>
    <text x="934" y="708" class="card-title" fill="#047857">Components &amp; traceability mappings</text>
    <text x="934" y="730" class="small">Ingested content stays linked; unlink marks source removed</text>
  </g>

  <text x="74" y="829" class="section">Validation snapshot</text>
  <g filter="url(#shadow)">
    <rect x="74" y="850" width="845" height="94" rx="16" fill="#fff"/>
    <circle cx="109" cy="883" r="10" fill="#10b981"/><text x="130" y="888" class="check">Frontend production build passed</text>
    <circle cx="416" cy="883" r="10" fill="#10b981"/><text x="437" y="888" class="check">Targeted frontend lint passed</text>
    <circle cx="109" cy="917" r="10" fill="#10b981"/><text x="130" y="922" class="check">Backend production package passed</text>
    <circle cx="416" cy="917" r="10" fill="#f59e0b"/><text x="437" y="922" class="body">Backend tests blocked by existing test compile error</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="947" y="850" width="418" height="94" rx="16" fill="#fff"/>
    <text x="976" y="883" class="card-title">Current limitation</text>
    <text x="976" y="908" class="body">A GitHub repository can be linked to only</text>
    <text x="976" y="930" class="body">one team at a time (existing DB uniqueness rule).</text>
  </g>
  <text x="74" y="977" class="small">SyncTrace · Repository management update · Nov 2026</text>
</svg>
