spring.application.name=IEEE Docs Evaluator

# 1. Import the untracked secrets file safely
spring.config.import=optional:classpath:application-secrets.properties

# 2. Supabase Transaction Pooler Connection
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Hibernate/JPA Configuration for the IEEE Evaluator
spring.jpa.hibernate.ddl-auto=update

# 3a. Flyway: owns the validation-metrics schema (src/main/resources/db/migration).
#     Existing tables are still managed by ddl-auto=update; an existing database with no
#     Flyway history is baselined at version 0 and then V1 is applied.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# 3b. Validation metrics: the single place every target and timing constant lives.
#     Any value can be overridden with an environment variable, e.g.
#     SYNCTRACE_VALIDATION_TARGETS_M1MAXMS=45000
synctrace.validation.targets.m1-max-ms=30000
synctrace.validation.targets.m2-max-ms=30000
synctrace.validation.targets.m3-max-ms=30000
synctrace.validation.targets.m4-max-ms=900000
synctrace.validation.targets.m5-min-rate=70
synctrace.validation.targets.m6-max-ms=60000
synctrace.validation.targets.m7-min-coverage=100
synctrace.validation.targets.m8-max-ms=10000
# A timing metric is "met" when at least this % of its runs finished within target.
synctrace.validation.targets.required-pct-within-target=100
synctrace.validation.heartbeat-interval-ms=30000
synctrace.validation.idle-gap-ms=120000
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Google Service Account (used for Sheets — allowlist, roster, submissions)
app.google.spreadsheet-id=${GOOGLE_SHEET_ID:}
app.google.service-account-json=${GOOGLE_SERVICE_ACCOUNT_JSON:}
app.google.service-account-json-base64=${GOOGLE_SERVICE_ACCOUNT_JSON_BASE64:}

# 5. Google OAuth (used for Drive — reading student submission files)
#    Obtain these from Google Cloud Console and the OAuth Playground.
#    See OAuthCredentialConfig.java for instructions.
app.google.oauth.client-id=${GOOGLE_CLIENT_ID:}
app.google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.oauth.refresh-token=${GOOGLE_REFRESH_TOKEN:}

# 6. Runtime application settings
app.openrouter.http-referer=${OPENROUTER_HTTP_REFERER:https://localhost}
app.openrouter.app-title=${OPENROUTER_APP_TITLE:IEEE Docs Evaluator}

# 7. CORS (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 8. Supabase JWT Configuration (for auth)
app.supabase.project-url=${SUPABASE_PROJECT_URL:}